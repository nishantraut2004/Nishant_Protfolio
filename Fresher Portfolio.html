<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name — AI & Data Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ---------- 1. TOKENS: colors and fonts ---------- */
:root{--bg:#fff;--ink:#0a0a0a;--muted:#6b6b76;--line:#e4e4ea;--on-ink:#fff;--accent:#4f46ff;
--c0:#14b8c4;--c1:#f59e0b;--c2:#e63e7a;
--display:"Inter Tight",system-ui,sans-serif;--body:Inter,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--ink:#f5f5f7;--muted:#9a9aa6;--line:#23232b;--on-ink:#0a0a0a;--accent:#8b87ff}}
:root[data-theme="dark"]{--bg:#0a0a0a;--ink:#f5f5f7;--muted:#9a9aa6;--line:#23232b;--on-ink:#0a0a0a;--accent:#8b87ff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);overflow-x:hidden}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:800;line-height:.95;letter-spacing:-.045em}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
#bar{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--c0),var(--c1),var(--c2));z-index:60}
header{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 22px 14px;mix-blend-mode:difference;color:#fff;pointer-events:none}
header a{font:600 15px var(--body);text-decoration:none;pointer-events:auto}
header .pill{border:1.5px solid #fff;border-radius:999px;padding:8px 18px}

/* ---------- 2. HERO: big type over live dot clusters ---------- */
#hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:56px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
#glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,35%),color-mix(in srgb,var(--c0) 22%,transparent),transparent 70%)}
.hero-in{position:relative;pointer-events:none}
.hero-in a,.hero-in button{pointer-events:auto}
#hero h1{font-size:clamp(54px,16vw,220px)}
#hero h1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
#hero h1 .w{display:inline-block;transform:translateY(110%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.12s + .15s)}
@keyframes up{to{transform:none}}
.sub{font-size:clamp(18px,2.6vw,26px);max-width:34ch;margin:22px 0 20px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font:600 15px var(--body);padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--k,var(--ink));border-color:var(--k,var(--ink));color:#fff}
.btn{display:inline-block;padding:15px 28px;border-radius:999px;font-weight:600;text-decoration:none;background:var(--ink);color:var(--on-ink);margin:0 10px 10px 0;transition:transform .2s,background .2s;will-change:transform}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn:hover{background:var(--accent);color:#fff;box-shadow:none}

/* ---------- 3. PINNED SCROLL STORY ---------- */
#story{position:relative}
.stick{position:sticky;top:0;height:100svh;display:grid;grid-template-rows:1fr 1fr;overflow:hidden;background:var(--bg)}
@media (min-width:820px){.stick{grid-template-rows:none;grid-template-columns:1fr 1fr;align-items:center;gap:40px;max-width:1180px;margin:0 auto;padding:0 22px}}
.info{padding:84px 22px 0;display:flex;flex-direction:column;justify-content:center}
@media (min-width:820px){.info{padding:0}}
.count{color:var(--muted);font-weight:600;margin-bottom:12px}
.info h2{font-size:clamp(40px,8vw,96px);min-height:2em}
.info p{color:var(--muted);max-width:36ch;margin:18px 0 8px}
.tag{display:inline-block;align-self:flex-start;font-weight:600;font-size:14px;padding:4px 12px;border-radius:999px;color:#fff;background:var(--c);margin-bottom:10px}
.stack{font-weight:600}
.go{margin-top:12px;font-weight:600}
.swap{transition:opacity .35s,transform .35s}
.swap.out{opacity:0;transform:translateY(16px)}
.art{position:relative;margin:0 22px 22px;border-radius:28px;background:var(--c,var(--accent));overflow:hidden;transition:background .6s,transform .15s ease-out;will-change:transform}
@media (min-width:820px){.art{margin:0;height:min(70vh,560px)}}
.art i{position:absolute;display:block;border:3px solid rgba(255,255,255,.85)}
.art i:nth-child(1){width:46%;aspect-ratio:1;left:12%;top:14%;border-radius:50%}
.art i:nth-child(2){width:40%;aspect-ratio:1;right:10%;bottom:12%;border-radius:26%}
.art i:nth-child(3){width:22%;aspect-ratio:1;right:24%;top:20%;border-radius:50%;background:rgba(255,255,255,.9);border:0}
.dots{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:5}
.dots button{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:transparent;padding:0;cursor:pointer}
.dots button[aria-current="true"]{background:var(--ink)}

/* ---------- 4. SKILL ROWS ---------- */
#skills{padding:100px 0;overflow:hidden}
.row{display:flex;gap:36px;width:max-content;will-change:transform}
.row span{font:800 clamp(52px,12vw,150px) var(--display);letter-spacing:-.045em;white-space:nowrap;line-height:1.1}
.row.o span{color:transparent;-webkit-text-stroke:2px var(--ink)}

/* ---------- 5. ABOUT, STATS, CONTACT ---------- */
section.pad{padding:96px 0}
#aboutTxt p{font:500 clamp(26px,4.4vw,52px)/1.12 var(--display);letter-spacing:-.03em;max-width:24ch;margin:0 0 22px}
.stats{display:flex;flex-wrap:wrap;gap:40px;margin-top:44px}
.stats b{display:block;font:800 clamp(48px,9vw,96px) var(--display);letter-spacing:-.05em;line-height:1}
.stats span{color:var(--muted)}
#contact{border-top:1px solid var(--line)}
.big{display:block;font:800 clamp(34px,9vw,120px) var(--display);letter-spacing:-.05em;line-height:1;text-decoration:none;word-break:break-all;transition:color .2s}
.big:hover{color:var(--accent)}
footer{padding-bottom:48px;color:var(--muted);font-size:14px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}

/* ---------- 5b. FRESHER SECTIONS ---------- */
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);margin-bottom:18px}
.badge i{width:9px;height:9px;border-radius:50%;background:#22c55e;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
.two{display:grid;gap:48px}
@media (min-width:820px){.two{grid-template-columns:1.3fr 1fr}}
.two h2{font-size:clamp(32px,6vw,56px);margin-bottom:24px}
.tl{list-style:none;margin:0;padding:0 0 0 24px;border-left:3px solid var(--line)}
.tl li{position:relative;padding:0 0 30px}
.tl li::before{content:"";position:absolute;left:-33px;top:7px;width:13px;height:13px;border-radius:50%;background:var(--accent)}
.tl h3{font-size:clamp(22px,4vw,32px);letter-spacing:-.03em;line-height:1.1}
.tl .when{color:var(--muted);font-weight:600;font-size:14px;margin-top:6px}
.tl p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0 0 40px}
.pills li{padding:8px 16px;border-radius:999px;border:2px solid var(--line);font-weight:600;font-size:15px}
.result{font-weight:600;color:var(--ink)}
/* ---------- 6. CURSOR (desktop) ---------- */
#cur{position:fixed;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);pointer-events:none;z-index:70;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s;display:none}
#cur.big{width:56px;height:56px;background:color-mix(in srgb,var(--c1) 30%,transparent)}
@media (pointer:fine){#cur{display:block}}
@media (prefers-reduced-motion:reduce){.badge i{animation:none}#hero h1 .w{animation:none;transform:none}.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.swap,#blob{transition:none}}
</style>
</head>
<body>
<div id="bar"></div><div id="cur"></div>
<header><a href="#hero" id="logo"></a><a class="pill" href="#contact">Contact</a></header>

<section id="hero">
  <canvas id="cv" role="img" aria-label="Animated dots grouped into skill clusters"></canvas>
  <div id="glow"></div>
  <div class="wrap hero-in">
    <div class="badge"><i></i><span id="badgeTxt"></span></div>
    <h1 id="headline"></h1>
    <p class="sub" id="role"></p>
    <div class="chips" id="chips" role="group" aria-label="Filter projects by skill"></div>
    <div id="heroBtns"></div>
  </div>
</section>

<section id="story" aria-label="Projects">
  <div class="stick">
    <div class="info">
      <div class="count" id="count"></div>
      <span class="tag swap" id="ptag"></span>
      <h2 class="swap" id="pt"></h2>
      <p class="swap" id="pd"></p>
      <div class="result swap" id="pr"></div>
      <div class="stack swap" id="ps"></div>
      <a class="go swap" id="pl" href="#">View project</a>
    </div>
    <div class="art" id="art" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="dots" id="dots"></div>
  </div>
</section>

<section id="skills" aria-label="Skills"><div class="row" id="r1"></div><div class="row o" id="r2"></div></section>

<section id="journey" class="pad"><div class="wrap two">
  <div><h2 class="rv">Education</h2><ol class="tl rv" id="edu"></ol></div>
  <div><h2 class="rv">Certifications</h2><ul class="pills rv" id="certs"></ul><h2 class="rv">Learning now</h2><ul class="pills rv" id="learn"></ul></div>
</div></section>

<section id="about" class="pad"><div class="wrap">
  <div id="aboutTxt" class="rv"></div>
  <div class="stats" id="stats"></div>
</div></section>

<section id="contact" class="pad"><div class="wrap">
  <p class="rv" style="color:var(--muted);margin:0 0 14px">Have a role or a project in mind?</p>
  <a class="big rv" id="mail" href="#"></a>
  <div class="rv" id="links" style="margin-top:36px"></div>
</div></section>
<footer><div class="wrap" id="foot"></div></footer>

<script>
/* ============ EDIT ONLY THIS BLOCK FOR CONTENT ============ */
const SITE = {
  name: "Your Name",
  email: "you@example.com",
  headline: ["Data in.", "Decisions out."],
  badge: "Open to internships and fresher roles",
  role: "AI & Data Science engineering student/graduate building models, dashboards and LLM apps.",
  resume: "resume.pdf",                                           // put your resume.pdf in the same folder
  education: [
    { title: "B.E. / B.Tech in AI & Data Science", where: "Your College, City", when: "2022 – 2026", text: "CGPA 8.5. Relevant courses: machine learning, data mining, deep learning, statistics." },
    { title: "Higher secondary (12th)", where: "Your School", when: "2022", text: "Add your score or stream." }
  ],
  certs: ["Google Data Analytics", "Machine Learning Specialization", "SQL for Data Science"],
  learning: ["Generative AI", "MLOps", "Data structures"],
  clusters: ["Analytics", "Machine learning", "NLP & LLMs"],      // colors: --c0 --c1 --c2
  projects: [
    { c: 0, title: "Sales insights dashboard", text: "What problem you solved and how.", result: "Result: add a number, e.g. cut report time by 60%.", stack: "Python, SQL, Power BI", href: "#" },
    { c: 0, title: "Customer segmentation", text: "What problem you solved and how.", result: "Result: add a number, e.g. 5 customer groups found.", stack: "Pandas, K-means", href: "#" },
    { c: 1, title: "Churn prediction", text: "Describe the data, model and accuracy.", result: "Result: add your accuracy, e.g. 87% accuracy.", stack: "scikit-learn, XGBoost", href: "#" },
    { c: 1, title: "Image classifier", text: "Describe the dataset and the outcome.", result: "Result: add your accuracy, e.g. 92% on test data.", stack: "CNN, TensorFlow", href: "#" },
    { c: 2, title: "Sentiment analysis", text: "Describe the text you analysed.", result: "Result: add what you found.", stack: "Transformers, Hugging Face", href: "#" },
    { c: 2, title: "Document Q&A chatbot", text: "Describe how it works and who it helps.", result: "Result: add what it helps users do.", stack: "LLMs, RAG, vector search", href: "#" }
  ],
  skills: ["Python", "SQL", "Machine learning", "Deep learning", "NLP", "Power BI", "Pandas", "TensorFlow", "Git"],
  about: ["Fresher who learns by building. I turn messy data into models people can use.", "Looking for an internship or entry-level role in data analytics or AI/ML."],
  stats: [{ n: 6, label: "Projects built" }, { n: 3, label: "Certifications" }, { n: 10, label: "Tools" }],
  links: [
    { label: "GitHub", href: "https://github.com/yourhandle" },
    { label: "LinkedIn", href: "https://linkedin.com/in/yourhandle" },
    { label: "Resume", href: "#" }
  ]
};
/* ========================================================= */

const $ = id => document.getElementById(id), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const col = i => `var(--c${i})`;

/* ---- render static content ---- */
document.title = SITE.name + " — AI & Data Science";
$("logo").textContent = SITE.name;
let wi = 0;
$("headline").innerHTML = SITE.headline.map(l =>
  `<span class="ln">${l.split(" ").map(w => `<span class="w" style="--i:${wi++}">${esc(w)}</span>`).join(" ")}</span>`).join("");
$("role").textContent = SITE.role;
$("chips").innerHTML = ["All", ...SITE.clusters].map((l, i) =>
  `<button class="chip" data-i="${i - 1}" style="--k:${i ? col(i - 1) : "var(--ink)"}" aria-pressed="${i === 0}">${esc(l)}</button>`).join("");
$("badgeTxt").textContent = SITE.badge;
$("heroBtns").innerHTML = `<a class="btn" href="#story">See my work</a><a class="btn alt" href="${esc(SITE.resume)}" download>Download resume</a>`;
$("edu").innerHTML = SITE.education.map(e => `<li><h3>${esc(e.title)}</h3><div class="when">${esc(e.where)} · ${esc(e.when)}</div><p>${esc(e.text)}</p></li>`).join("");
$("certs").innerHTML = SITE.certs.map(c => `<li>${esc(c)}</li>`).join("");
$("learn").innerHTML = SITE.learning.map(c => `<li>${esc(c)}</li>`).join("");
const rows = SITE.skills.concat(SITE.skills).map(s => `<span>${esc(s)}</span>`).join("");
$("r1").innerHTML = rows; $("r2").innerHTML = rows;
$("aboutTxt").innerHTML = SITE.about.map(t => `<p>${esc(t)}</p>`).join("");
$("stats").innerHTML = SITE.stats.map(s => `<div class="rv"><b data-n="${s.n}">0</b><span>${esc(s.label)}</span></div>`).join("");
$("mail").textContent = SITE.email; $("mail").href = "mailto:" + SITE.email;
$("links").innerHTML = SITE.links.map(l => `<a class="btn alt" href="${esc(l.href)}">${esc(l.label)}</a>`).join("");
$("foot").textContent = "© " + new Date().getFullYear() + " " + SITE.name;

/* ---- filter: chips drive dots AND the pinned story ---- */
let active = -1, list = SITE.projects, cur = -1;
function applyFilter() {
  list = active === -1 ? SITE.projects : SITE.projects.filter(p => p.c === active);
  $("story").style.height = (list.length * 100 + 100) + "svh";
  $("dots").innerHTML = list.map((p, i) => `<button aria-label="Project ${i + 1}: ${esc(p.title)}" data-i="${i}"></button>`).join("");
  cur = -1; onScroll();
  if (still) drawStill();
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  active = +b.dataset.i;
  $$(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
  applyFilter();
});
function show(i) {
  if (i === cur) return; cur = i;
  const p = list[i], sw = $$(".swap");
  sw.forEach(e => e.classList.add("out"));
  setTimeout(() => {
    $("count").textContent = String(i + 1).padStart(2, "0") + " / " + String(list.length).padStart(2, "0");
    $("ptag").textContent = SITE.clusters[p.c]; $("ptag").style.setProperty("--c", col(p.c));
    $("pt").textContent = p.title; $("pd").textContent = p.text; $("pr").textContent = p.result; $("ps").textContent = p.stack; $("pl").href = p.href;
    $("art").style.setProperty("--c", col(p.c));
    sw.forEach(e => e.classList.remove("out"));
  }, still ? 0 : 180);
  $$(".dots button").forEach((b, k) => b.setAttribute("aria-current", k === i));
}
$("dots").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const top = $("story").getBoundingClientRect().top + scrollY;
  scrollTo({ top: top + (+b.dataset.i + .5) * innerHeight, behavior: still ? "auto" : "smooth" });
});

/* ---- one scroll handler ---- */
function onScroll() {
  const h = document.documentElement, vh = innerHeight;
  $("bar").style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + "%";
  const s = $("story").getBoundingClientRect();
  const prog = Math.min(Math.max(-s.top / Math.max(s.height - vh, 1), 0), .9999);
  show(Math.min(Math.floor(prog * list.length), list.length - 1));
  const a = $("art").children;
  a[0].style.transform = `rotate(${prog * 360}deg)`;
  a[1].style.transform = `rotate(${-prog * 270}deg) scale(${1 + Math.sin(prog * 6.28) * .1})`;
  a[2].style.transform = `translateY(${Math.sin(prog * 12.56) * 30}px)`;
  const t = ($("skills").getBoundingClientRect().top - vh) * .35;
  $("r1").style.transform = `translateX(${t}px)`;
  $("r2").style.transform = `translateX(${-t - 600}px)`;
}
addEventListener("scroll", onScroll, { passive: true }); addEventListener("resize", onScroll);

/* ---- reveal + counters ---- */
const count = el => {
  const n = +el.dataset.n; if (still) return el.textContent = n;
  let t0; const step = t => { t0 ??= t; const p = Math.min((t - t0) / 1200, 1); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
};
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in"); io.unobserve(e.target);
  const b = e.target.querySelector("[data-n]"); if (b) count(b);
}), { threshold: .2 });
$$(".rv").forEach(el => io.observe(el));

/* ---- magnetic buttons, art tilt, cursor ---- */
$$(".btn").forEach(b => {
  b.addEventListener("pointermove", e => {
    if (still || e.pointerType !== "mouse") return;
    const r = b.getBoundingClientRect();
    b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .25}px,${(e.clientY - r.top - r.height / 2) * .35}px)`;
  });
  b.addEventListener("pointerleave", () => b.style.transform = "");
});
$("art").addEventListener("pointermove", e => {
  if (still || e.pointerType !== "mouse") return;
  const r = $("art").getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  $("art").style.transform = `perspective(900px) rotateX(${-y * 8}deg) rotateY(${x * 8}deg)`;
});
$("art").addEventListener("pointerleave", () => $("art").style.transform = "");
addEventListener("pointermove", e => { $("cur").style.left = e.clientX + "px"; $("cur").style.top = e.clientY + "px"; });
document.addEventListener("pointerover", e => $("cur").classList.toggle("big", !!e.target.closest("a,button")));

/* ---- hero dot clusters ---- */
const hero = $("hero"), cv = $("cv"), ctx = cv.getContext("2d");
let W, H, dots = [], ptr = { x: -999, y: -999 };
const centers = [[.2,.26],[.5,.14],[.8,.26]];
const rnd = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
function build() {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  const n = W < 500 ? 110 : 200;
  dots = Array.from({ length: n }, (_, i) => ({ c: i % 3, ox: rnd(), oy: rnd(), x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, r: 2 + Math.random() * 2.6 }));
}
function frame() {
  const cs = getComputedStyle(document.documentElement), cols = [0, 1, 2].map(i => cs.getPropertyValue("--c" + i).trim());
  ctx.clearRect(0, 0, W, H);
  const R = Math.min(W * .15, 90);
  for (const p of dots) {
    const sel = active === -1 || active === p.c, sp = active === -1 ? 1 : sel ? .7 : 1.3;
    const tx = centers[p.c][0] * W + p.ox * R * sp, ty = centers[p.c][1] * H + p.oy * R * sp;
    p.vx += (tx - p.x) * .02; p.vy += (ty - p.y) * .02;
    const dx = p.x - ptr.x, dy = p.y - ptr.y, d2 = dx * dx + dy * dy;
    if (d2 < 10000) { const m = Math.sqrt(d2) || 1, f = (100 - m) * .035; p.vx += dx / m * f; p.vy += dy / m * f; }
    p.vx *= .86; p.vy *= .86; p.x += p.vx; p.y += p.vy;
    ctx.globalAlpha = sel ? .95 : .18; ctx.fillStyle = cols[p.c];
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  if (!still) requestAnimationFrame(frame);
}
function drawStill() { for (let i = 0; i < 200; i++) frame(); }
hero.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect(); ptr = { x: e.clientX - r.left, y: e.clientY - r.top };
  hero.style.setProperty("--mx", ptr.x + "px"); hero.style.setProperty("--my", ptr.y + "px");
});
hero.addEventListener("pointerleave", () => ptr = { x: -999, y: -999 });
addEventListener("resize", () => { build(); if (still) drawStill(); });
build(); applyFilter();
if (still) drawStill(); else requestAnimationFrame(frame);
</script>
</body>
